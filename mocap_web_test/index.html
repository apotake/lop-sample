<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mocap Web Test</title>
    <script type="module" crossorigin src="/mocap_web_test/assets/index-BBwENa7G.js"></script>
    <link rel="stylesheet" crossorigin href="/mocap_web_test/assets/index-CcdBe0gQ.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Mocap Web Test</h1>

        <span id="fps" class="fps"></span>
      </div>

      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>
