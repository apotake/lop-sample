<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArUco Marker Detection</title>
    <!-- A-Frameタグをhead内に移動 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
        // マーカーが見つかった時にアニメーションを開始させるためのコンポーネント
        AFRAME.registerComponent('marker-animator', {
            init: function () {
                this.el.addEventListener('markerFound', () => {
                    const pivot = this.el.querySelector('[id$="-pivot"]');
                    if (pivot) {
                        pivot.emit('markerFound');
                    }
                });
            }
        });

        // リサイズ時に AR.js の内部コンポーネントにリサイズを通知する
        window.addEventListener('resize', () => {
            const scene = document.querySelector('a-scene');
            if (scene && scene.systems.arjs) {
                const arjsSystem = scene.systems.arjs;
                if (arjsSystem._arToolkitSource) {
                    arjsSystem._arToolkitSource.onResizeElement();
                    arjsSystem._arToolkitSource.copyElementSizeTo(scene.renderer.domElement);
                    
                    // 追加：ビデオ要素自体のリサイズも強制
                    const video = document.querySelector('video');
                    if (video) {
                        arjsSystem._arToolkitSource.copyElementSizeTo(video);
                    }
                }
            }
        });
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100; /* 常に最前面に表示 */
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            font-family: sans-serif;
            pointer-events: none; /* 下の要素の操作を邪魔しない */
        }
        /* AR.jsのビデオ背景が親要素に追従するように設定 */
        .a-scene {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        /* AR用キャンバス（3D描画） */
        .a-canvas {
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
            position: absolute !important;
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">
    <div id="status">AR.js (A-Frame版) を読み込んでいます...</div>

    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;' vr-mode-ui="enabled: false">
        <a-assets>
            <img id="atsumi-img" src="atsumi.png">
            <img id="obinata-img" src="obinata.png">
            <img id="yoshie-img" src="yoshie.png">
        </a-assets>

        <!-- ID: 0 のマーカー -->
        <a-marker type='barcode' value='0' marker-animator>
            <a-plane position="0 0 0" rotation="-90 0 0" width="1.1" height="1.1" material="color: lime; wireframe: true; wireframeLinewidth: 5"></a-plane>
            <a-entity id="atsumi-pivot" position="0 0 0" rotation="0 0 0"
                     animation__rotate_cw="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; easing: linear; startEvents: animationcomplete__rotate_ccw, markerFound"
                     animation__wait1="property: rotation; from: 0 360 0; to: 0 360 0; dur: 1000; startEvents: animationcomplete__rotate_cw"
                     animation__tilt_on="property: rotation; from: 0 360 0; to: 0 360 -20; dur: 1000; easing: easeInOutQuad; startEvents: animationcomplete__wait1"
                     animation__tilt_off="property: rotation; from: 0 360 -20; to: 0 360 0; dur: 1000; easing: easeInOutQuad; startEvents: animationcomplete__tilt_on"
                     animation__wait2="property: rotation; from: 0 360 0; to: 0 360 0; dur: 1000; startEvents: animationcomplete__tilt_off"
                     animation__rotate_ccw="property: rotation; from: 0 360 0; to: 0 0 0; dur: 2000; easing: linear; startEvents: animationcomplete__wait2">
                <a-image id="atsumi-display" src="#atsumi-img" position="0 0.5 0" rotation="0 90 0" width="1" height="1" 
                         material="shader: standard; transparent: true; alphaTest: 0.5; color: #ffffff;">
                </a-image>
            </a-entity>
            <a-entity line="start: 0 0 0; end: 1 0 0; color: red"></a-entity>
            <a-text value="x" position="1.1 0 0" align="center" color="red" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-text>
            <a-entity line="start: 0 0 0; end: 0 1 0; color: green"></a-entity>
            <a-text value="y" position="0 1.1 0" align="center" color="green" scale="0.5 0.5 0.5" rotation="0 90 0"></a-text>
            <a-entity line="start: 0 0 0; end: 0 0 1; color: blue"></a-entity>
            <a-text value="z" position="0 0 1.1" align="center" color="blue" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-text>
            <a-text value="ID: 0" position="0 0.2 -0.3" align="center" color="white" scale="1 1 1" rotation="-90 0 0"></a-text>
        </a-marker>

        <!-- ID: 1 のマーカー -->
        <a-marker type='barcode' value='1' marker-animator>
            <a-plane position="0 0 0" rotation="-90 0 0" width="1.1" height="1.1" material="color: lime; wireframe: true; wireframeLinewidth: 5"></a-plane>
            <a-entity id="obinata-pivot" position="0 0 0" rotation="0 0 0"
                     animation__rotate_cw="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; easing: linear; startEvents: animationcomplete__rotate_ccw, markerFound"
                     animation__wait1="property: rotation; from: 0 360 0; to: 0 360 0; dur: 1000; startEvents: animationcomplete__rotate_cw"
                     animation__tilt_on="property: rotation; from: 0 360 0; to: 0 360 -20; dur: 1000; easing: easeInOutQuad; startEvents: animationcomplete__wait1"
                     animation__tilt_off="property: rotation; from: 0 360 -20; to: 0 360 0; dur: 1000; easing: easeInOutQuad; startEvents: animationcomplete__tilt_on"
                     animation__wait2="property: rotation; from: 0 360 0; to: 0 360 0; dur: 1000; startEvents: animationcomplete__tilt_off"
                     animation__rotate_ccw="property: rotation; from: 0 360 0; to: 0 0 0; dur: 2000; easing: linear; startEvents: animationcomplete__wait2">
                <a-image id="obinata-display" src="#obinata-img" position="0 0.5 0" rotation="0 90 0" width="1" height="1" 
                         material="shader: standard; transparent: true; alphaTest: 0.5; color: #ffffff;">
                </a-image>
            </a-entity>
            <a-entity line="start: 0 0 0; end: 1 0 0; color: red"></a-entity>
            <a-text value="x" position="1.1 0 0" align="center" color="red" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-text>
            <a-entity line="start: 0 0 0; end: 0 1 0; color: green"></a-entity>
            <a-text value="y" position="0 1.1 0" align="center" color="green" scale="0.5 0.5 0.5" rotation="0 90 0"></a-text>
            <a-entity line="start: 0 0 0; end: 0 0 1; color: blue"></a-entity>
            <a-text value="z" position="0 0 1.1" align="center" color="blue" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-text>
            <a-text value="ID: 1" position="0 0.2 -0.3" align="center" color="white" scale="1 1 1" rotation="-90 0 0"></a-text>
        </a-marker>

        <!-- ID: 2 のマーカー -->
        <a-marker type='barcode' value='2' marker-animator>
            <a-plane position="0 0 0" rotation="-90 0 0" width="1.1" height="1.1" material="color: lime; wireframe: true; wireframeLinewidth: 5"></a-plane>
            <a-entity id="yoshie-pivot" position="0 0 0" rotation="0 0 0"
                     animation__rotate_cw="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; easing: linear; startEvents: animationcomplete__rotate_ccw, markerFound"
                     animation__wait1="property: rotation; from: 0 360 0; to: 0 360 0; dur: 1000; startEvents: animationcomplete__rotate_cw"
                     animation__tilt_on="property: rotation; from: 0 360 0; to: 0 360 -20; dur: 1000; easing: easeInOutQuad; startEvents: animationcomplete__wait1"
                     animation__tilt_off="property: rotation; from: 0 360 -20; to: 0 360 0; dur: 1000; easing: easeInOutQuad; startEvents: animationcomplete__tilt_on"
                     animation__wait2="property: rotation; from: 0 360 0; to: 0 360 0; dur: 1000; startEvents: animationcomplete__tilt_off"
                     animation__rotate_ccw="property: rotation; from: 0 360 0; to: 0 0 0; dur: 2000; easing: linear; startEvents: animationcomplete__wait2">
                <a-image id="yoshie-display" src="#yoshie-img" position="0 0.5 0" rotation="0 90 0" width="1" height="1" 
                         material="shader: standard; transparent: true; alphaTest: 0.5; color: #ffffff;">
                </a-image>
            </a-entity>
            <a-entity line="start: 0 0 0; end: 1 0 0; color: red"></a-entity>
            <a-text value="x" position="1.1 0 0" align="center" color="red" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-text>
            <a-entity line="start: 0 0 0; end: 0 1 0; color: green"></a-entity>
            <a-text value="y" position="0 1.1 0" align="center" color="green" scale="0.5 0.5 0.5" rotation="0 90 0"></a-text>
            <a-entity line="start: 0 0 0; end: 0 0 1; color: blue"></a-entity>
            <a-text value="z" position="0 0 1.1" align="center" color="blue" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-text>
            <a-text value="ID: 2" position="0 0.2 -0.3" align="center" color="white" scale="1 1 1" rotation="-90 0 0"></a-text>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        window.addEventListener('arjs-video-loaded', () => {
            document.getElementById('status').innerHTML = 'カメラ準備完了。マーカー(Barcode 3x3)をかざしてください。';
            
            // ビデオ要素を取得して解像度を表示
            const video = document.querySelector('video');
            if (video) {
                const updateResolutionText = () => {
                    const width = video.videoWidth;
                    const height = video.videoHeight;
                    
                    // 解像度がまだ確定していない(0)場合は、少し待ってから再試行
                    if (width === 0 || height === 0) {
                        setTimeout(updateResolutionText, 500);
                        return;
                    }

                    const displayInfo = document.createElement('div');
                    displayInfo.id = 'resolution-text';
                    displayInfo.style.fontSize = '12px';
                    displayInfo.style.marginTop = '5px';
                    displayInfo.innerHTML = `カメラ解像度: ${width}x${height}`;
                    
                    const statusEl = document.getElementById('status');
                    // 既に存在する場合は更新、なければ追加
                    const existing = document.getElementById('resolution-text');
                    if (existing) {
                        existing.innerHTML = displayInfo.innerHTML;
                    } else {
                        statusEl.appendChild(displayInfo);
                    }
                };

                // メタデータの読み込み完了を待つか、即時実行
                if (video.readyState >= 1) {
                    updateResolutionText();
                } else {
                    video.addEventListener('loadedmetadata', updateResolutionText);
                }
            }

            // 各画像の縦横比を維持するための処理
            const configs = [
                { img: '#atsumi-img', display: '#atsumi-display' },
                { img: '#obinata-img', display: '#obinata-display' },
                { img: '#yoshie-img', display: '#yoshie-display' }
            ];

            configs.forEach(conf => {
                const img = document.querySelector(conf.img);
                const targetImage = document.querySelector(conf.display);
                
                if (img.complete) {
                    updateAspectRatio(img, targetImage);
                } else {
                    img.onload = () => updateAspectRatio(img, targetImage);
                }
            });

            function updateAspectRatio(img, targetImage) {
                const ratio = img.naturalHeight / img.naturalWidth;
                targetImage.setAttribute('height', ratio);
                
                // 画像の中心を高さの半分に設定することで、親要素(pivot)の(0,0,0)が画像の底辺になる
                targetImage.setAttribute('position', `0 ${ratio / 2} 0`);
            }

        setTimeout(() => {
            // ステータスメッセージを消すだけで、解像度情報は残したいため、appendChildをbodyに直付けするか、新しい要素を作成します
            // 既存のstatus要素を消去する代わりに内容をクリアし、解像度情報を永続化させます
            const statusEl = document.getElementById('status');
            const resInfo = statusEl.querySelector('div')?.innerHTML || '';
            statusEl.innerHTML = resInfo; // 初期メッセージを消し、解像度情報のみにする
            statusEl.style.fontSize = '12px';
            statusEl.style.padding = '5px 10px';
        }, 3000);
    });
</script>
</body>
</html>
